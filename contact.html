<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Future School</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="container navbar">
      <a class="brand" href="index.html">Future<span>School</span></a>
      <button class="menu" aria-label="Menu">&#9776;</button>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="blog.html">News</a></li>
        <li><a href="booking.html">Activities</a></li>
        <li><a href="contact.html" class="on">Contact</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
    </div>
  </header>

  <section class="hero small">
    <div class="container">
      <h1>Contact Us</h1>
      <p>We would love to hear from you.</p>
    </div>
  </section>

  <section class="sec">
    <div class="container split">
      <div class="box info">
        <h2>Get in Touch</h2>
        <p><b>Address:</b> School address</p>
        <p><b>Phone:</b> School phone</p>
        <p><b>Email:</b> School email</p>
      </div>
      <form class="box" action="#" method="post">
        <label for="n">Name</label>
        <input type="text" id="n" name="n" required>

        <label for="e">Email</label>
        <input type="email" id="e" name="e" required>

        <label for="s">Subject</label>
        <input type="text" id="s" name="s" required>

        <label for="m">Message</label>
        <textarea id="m" name="m" rows="5" required></textarea>

        <button class="btn" type="submit">Send Message</button>
      </form>
    </div>
  </section>

  <footer>
    <div class="container foot">
      <p>&copy; Future School. All rights reserved.</p>
      <p>School address &bull; School email</p>
    </div>
  </footer>

  <script>
    document.querySelector(".menu").addEventListener("click", function () {
      document.querySelector(".nav-links").classList.toggle("show");
    });
  </script>

</body>
</html>
